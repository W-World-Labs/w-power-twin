name: Public source CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: power-twin-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      W_RADAR_CODE: ''
      POWER_TWIN_BROWSER_TELEMETRY: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Source, history and all-object secret scans
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow --no-banner
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts='--all --full-history --reflog' --redact=100 --ignore-gitleaks-allow --no-banner
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'git-object-payloads'
          output.mkdir(mode=0o700)
          for row in subprocess.check_output(['git', 'cat-file', '--batch-all-objects', '--batch-check=%(objectname) %(objecttype)']).decode().splitlines():
              oid, kind = row.split()
              if kind in {'blob', 'commit', 'tag'}:
                  (output / (oid + '.' + kind)).write_bytes(subprocess.check_output(['git', 'cat-file', kind, oid]))
          PY
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/git-object-payloads" --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow --no-banner
      - name: Source helper syntax only
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('scripts').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
          bash -n scripts/optimize_models.sh
      - name: Install locked public frontend dependencies and compile
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0
      - name: Check original Rust assertions and compile
        working-directory: server
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo build --release --locked
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/power-twin-cargo-metadata.json"
      - name: Archive exact source and locked licence declarations
        run: python3 scripts/source-artifact.py "$RUNNER_TEMP/power-twin-cargo-metadata.json" "$RUNNER_TEMP/w-power-twin-source"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: w-power-twin-source-${{ github.sha }}
          path: ${{ runner.temp }}/w-power-twin-source/
          if-no-files-found: error
          retention-days: 7
